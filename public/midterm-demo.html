<div class="app"><aside class="sidebar"><div class="brand"><span class="mark" aria-hidden="true">⌣</span>월계밥상</div><p class="brand-note">우리 동네, 함께 먹는 즐거움</p><nav class="nav" aria-label="주 메뉴"><button data-action="nav" data-view="meal" id="nav-meal">◉ &nbsp; 함께 먹기</button><button data-action="nav" data-view="wiki" id="nav-wiki">▤ &nbsp; 동네 가게</button><button data-action="nav" data-view="profile" id="nav-profile">✧ &nbsp; 나의 기여</button></nav><div class="sidebar-foot">2026 KW HACKATHON<strong>월계방위대</strong>동네의 작은 정보가<br>다음 한 끼를 바꿉니다.</div></aside>
<div class="main"><header class="topbar"><span class="location">⌖ 광운대학교 · 월계1동</span><div class="row"><span class="badge amber">중간발표 데모</span><button class="text tiny" data-action="reset">처음부터</button><span class="avatar" aria-label="내 프로필">나</span></div></header><main class="content"><details class="demo-note"><summary>시연용 데이터로 체험 중 · 실제 가게·실시간 공동 접속이 아닙니다</summary><p>이 브라우저에서 참가자를 전환하며 시연합니다. 카카오 공유와 메뉴판 인식은 미리보기이며 외부 API를 호출하지 않습니다. 선택과 수정 기록은 이 기기에만 저장됩니다. 사진 원본은 새로고침하면 사라집니다.</p></details><div id="screen"></div><p class="footer-note">월계밥상 · 함께 선택하고, 함께 채우는 동네 식사 플랫폼</p></main></div></div>
<div id="toast" class="toast" role="status" hidden></div><div id="modal" class="modal" hidden><section class="modal-inner" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div id="modal-content"></div><button class="full" data-action="close-modal" style="margin-top:18px">닫기</button></section></div>
<script>
'use strict';
const KEY='wolgye-midterm-v1';
const seedPlaces=[
 {id:'r1',name:'골목반점',category:'중식',menu:'짜장면',price:7000,minutes:38,walk:5,spicy:false,color:'#e9d7ba',kind:'noodle',checked:'2026.09.25'},
 {id:'r2',name:'월계한상',category:'한식',menu:'제육백반',price:8500,minutes:43,walk:7,spicy:true,color:'#dce5ce',kind:'rice',checked:'2026.09.25'},
 {id:'r3',name:'초록덮밥',category:'일식',menu:'달걀덮밥',price:9500,minutes:35,walk:4,spicy:false,color:'#eddec8',kind:'rice',checked:'2026.09.24'},
 {id:'r4',name:'담백한식탁',category:'한식',menu:'두부정식',price:11000,minutes:45,walk:8,spicy:false,color:'#dedfce',kind:'rice',checked:'2026.09.23'},
 {id:'r5',name:'느린국수',category:'분식',menu:'잔치국수',price:6500,minutes:58,walk:12,spicy:false,color:'#e8dcca',kind:'noodle',checked:'2026.09.24'}
];
const fresh=()=>({version:1,view:'meal',stage:0,room:null,active:'me',members:[],places:structuredClone(seedPlaces),candidates:[],votes:{},submitted:[],winner:null,history:[],contributions:0,round:0});
let state=fresh(),photo=null,photoLabel='',editingId=null,lastFocus=null,toastTimer;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version===1 && Array.isArray(saved.places)&&Array.isArray(saved.members)&&Array.isArray(saved.history)&&Array.isArray(saved.candidates)&&Array.isArray(saved.submitted)&&saved.votes&&typeof saved.votes==='object')state=saved;}catch{}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Number(n).toLocaleString('ko-KR')+'원';
const screen=document.getElementById('screen');
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{notify('저장 공간을 사용할 수 없어 이번 화면에서만 유지됩니다.');}}
function notify(msg){const el=document.getElementById('toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{el.hidden=true;},3400);}
function food(p){return `<div class="food-art" style="background:${p.color}"><span class="tag">시연용 가상 가게</span><svg viewBox="0 0 180 140" role="img" aria-label="${esc(p.menu)} 일러스트"><ellipse cx="90" cy="111" rx="65" ry="11" fill="#000" opacity=".06"/><path d="M24 60 Q29 118 90 122 Q153 119 157 60" fill="#f7f4e9"/><ellipse cx="90" cy="60" rx="67" ry="33" fill="#fffdf4" stroke="#d9d4c2" stroke-width="3"/><ellipse cx="90" cy="60" rx="53" ry="25" fill="${p.kind==='noodle'?'#744630':'#e9d09a'}"/>${p.kind==='noodle'?'<path d="M50 55 Q68 38 88 60 T131 55 M50 66 Q70 46 95 68 T128 63" fill="none" stroke="#cba264" stroke-width="4"/>':'<ellipse cx="94" cy="57" rx="26" ry="16" fill="#fff5d4"/><circle cx="95" cy="54" r="11" fill="#ecb344"/>'}<path d="M64 45 l14 6 M108 70 l16 -4 M69 76 l9 -8" stroke="#61906b" stroke-width="6" stroke-linecap="round"/><path d="M121 22 L160 7 M125 29 L169 16" stroke="#956d43" stroke-width="4" stroke-linecap="round"/></svg></div>`;}
function steps(){return `<div class="steps" aria-label="진행 단계">${['모임 만들기','조건 모으기','추천과 투표','식당 결정','정보 보태기'].map((x,i)=>`<span class="step ${state.stage===i?'current':state.stage>i?'done':''}">${i+1} ${x}</span>`).join('')}</div>`;}
function memberButtons(){return `<div class="members" aria-label="시연 참가자 전환">${state.members.map(m=>`<button data-action="member" data-id="${esc(m.id)}" class="${state.active===m.id?'selected':''}" aria-pressed="${state.active===m.id}"><span class="avatar">${esc(m.name.slice(0,1))}</span>${esc(m.name)}${state.submitted.includes(m.id)?' ✓':''}</button>`).join('')}</div>`;}
function render(){
 document.querySelectorAll('.nav button').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
 screen.innerHTML=state.view==='wiki'?wiki():state.view==='profile'?profile():state.stage===0?lobby():steps()+(state.stage===1?conditions():state.stage===2?voting():state.stage===3?result():contribute());
 save();
}
function lobby(){return `<section class="hero"><div class="hero-copy"><p class="eyebrow">A TABLE FOR EVERYONE</p><h1>오늘 뭐 먹지?<br>우리 같이 정해요.</h1><p>만원 이하, 짜장면, 공강 50분.<br>각자의 조건을 모아 모두가 갈 수 있는 한 끼를 찾아요.</p><span class="badge">광운대 앞 작은 가게부터</span></div><div class="hero-art"><svg viewBox="0 0 360 230" role="img" aria-label="월계동 골목의 작은 식당들"><circle cx="285" cy="43" r="28" fill="#efce74"/><path d="M0 202 Q180 179 360 202 L360 230 H0" fill="#b7c6a5"/><rect x="25" y="80" width="140" height="119" rx="3" fill="#efdfb9"/><path d="M16 82 L96 41 L174 82" fill="#668269"/><rect x="38" y="91" width="113" height="25" fill="#f7f3df"/><text x="94" y="109" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#36553c">골목 식당</text><rect x="43" y="131" width="46" height="45" fill="#839784"/><rect x="105" y="131" width="37" height="68" fill="#597b69"/><rect x="188" y="103" width="145" height="96" fill="#e9c9a3"/><rect x="183" y="81" width="154" height="26" fill="#c8734e"/><path d="M183 107 h154 l-6 19 h-142z" fill="#f6efd6"/><path d="M194 107 v18 M218 107 v18 M245 107 v18 M271 107 v18 M298 107 v18 M325 107 v18" stroke="#ca794d" stroke-width="12"/><rect x="203" y="139" width="52" height="40" fill="#879e87"/><rect x="273" y="139" width="41" height="60" fill="#526e5b"/><circle cx="172" cy="157" r="23" fill="#87a477"/><path d="M173 168 v35" stroke="#797451" stroke-width="7"/><rect x="151" y="196" width="43" height="13" rx="4" fill="#b5885e"/></svg></div></section><div class="grid2"><section class="panel"><p class="eyebrow">01 START A TABLE</p><h2>함께 먹을 모임 만들기</h2><form id="create-form"><label class="field">모임 이름<input name="roomName" value="오늘 공강 점심팟" maxlength="30" required></label><label class="field">내 닉네임<input name="nickname" value="나" maxlength="12" required></label><button class="primary full" style="margin-top:22px" type="submit">모임 만들기 →</button></form></section><section class="panel soft"><p class="eyebrow">02 JOIN A TABLE</p><h2>초대받으셨나요?</h2><p class="sub">친구가 공유한 팀 코드로 모임을 찾아요.</p><form id="join-form"><label class="field">팀 코드<input name="code" placeholder="예: WG1234" maxlength="6" required autocomplete="off"></label><label class="field">닉네임<input name="nickname" placeholder="친구들에게 보일 이름" maxlength="12" required></label><button class="full" style="margin-top:22px" type="submit">모임 참여하기</button></form><p class="notice">데모에서는 이 브라우저에서 만든 모임에만 참여할 수 있어요.</p></section></div><div class="section-head"><h3>함께 채우면, 더 좋은 추천이 돼요</h3><p class="sub">방문한 가게의 메뉴판 한 장, 가격 확인 한 번으로 시작해요.</p></div>`;}
function naturalConditions(phrase){
 const s=phrase.replaceAll(',','').trim(),compact=s.replace(/\s/g,'');
 const result={phrase,budget:null,minutes:null,preference:'아무거나',preferences:[],excludedMenus:[],noSpicy:false,notes:[]};
 const money=[...compact.matchAll(/((?:\d+(?:\.\d+)?만)?(?:\d+(?:\.\d+)?천)?(?:\d+)?|만|천)원/g)].filter(m=>m[1]);
 const moneyValue=t=>{let total=0;const man=t.match(/(\d+(?:\.\d+)?)?만/),thousand=t.match(/(\d+(?:\.\d+)?)?천/);if(man)total+=Number(man[1]||1)*10000;if(thousand)total+=Number(thousand[1]||1)*1000;const rest=t.replace(/(?:\d+(?:\.\d+)?)?[만천]/g,'');return total+Number(rest||0);};
 const moneyFree=/(돈|가격|예산)(은|는|이|가)?(상관없|제한없)/.test(compact);
 if(money.length===1&&!moneyFree){const m=money[0],after=compact.slice(m.index+m[0].length,m.index+m[0].length+8);if(/^(이하|이내|까지|미만|안)/.test(after)){result.budget=moneyValue(m[1])-(/^미만/.test(after)?1:0);}else result.notes.push('금액의 상한인지 불분명해요. “만원 이하”처럼 적어 주세요.');}
 if(money.length>1)result.notes.push('금액이 여러 개 있어요. 1인 최대 예산 하나로 다시 적어 주세요.');
 const times=[...compact.matchAll(/(\d+)분/g)];
 if(times.length===1){const m=times[0],after=compact.slice(m.index+m[0].length);if(/^(이내|안|이하)/.test(after)&&/(돌아|복귀)/.test(after)){result.minutes=Number(m[1]);}else result.notes.push('시간 범위가 불분명해요. “50분 안에 돌아와야 해”처럼 적어 주세요.');}
 if(times.length>1)result.notes.push('시간이 여러 개 있어요. 복귀까지 남은 시간 하나로 적어 주세요.');
 if(/시간/.test(s)&&!times.length&&!/(시간.*(상관없|제한없))/.test(s))result.notes.push('시간 표현은 “60분 안에 돌아와야 해”처럼 분 단위로 적어 주세요.');
 result.noSpicy=/(매운|매운음식|매운메뉴|매운건|매운것)(은|는|을|를|이|가)?(못|안|싫|제외|빼|피하)/.test(compact)||/맵지않/.test(compact);
 for(const menu of ['짜장면','중식','한식','덮밥','국수','일식','분식']){const at=compact.indexOf(menu);if(at<0)continue;const after=compact.slice(at+menu.length,at+menu.length+12);if(/^(은|는|을|를|이|가)?(말고|싫|제외|빼|못먹|안먹)/.test(after))result.excludedMenus.push(menu);else result.preferences.push(menu);}
 result.preference=result.preferences[0]||'아무거나';
 if(/빨리|빠르|빠른|저렴|싸게|가성비/.test(s))result.notes.push('“빨리·저렴하게”는 숫자로 바꾸지 않아요. 구체적인 제한이 있으면 추가해 주세요.');
 if(/조용|분위기|국물|가까|주차|알레르|채식|비건|땅콩|해산물|휠체어/.test(s))result.notes.push('분위기·거리·식재료 등은 현재 시연에서 판단하지 못해요. 원문만 보관하며 추천에는 미반영됩니다.');
 if(result.budget===null&&result.minutes===null&&!result.preferences.length&&!result.excludedMenus.length&&!result.noSpicy&&!result.notes.length&&!/^(아무거나(괜찮아|괜찮아요|좋아|좋아요)?|조건없(어|어요)?|상관없(어|어요)?)[.!?]*$/.test(compact))result.notes.push('이 문장에서 지원하는 조건을 찾지 못했어요. 내용을 바꾸거나 조건 없이 진행할지 확인해 주세요.');
 return result;
}
function conditionSummary(p){return `<div class="hint" style="margin-top:22px"><h3>이렇게 이해했어요</h3><div class="chips"><span class="badge">${p.budget===null?'예산 · 제한 미입력':esc(won(p.budget))+' 이하'}</span><span class="badge">${p.minutes===null?'시간 · 제한 미입력':p.minutes+'분 안에 복귀'}</span>${p.preferences.map(x=>`<span class="badge">${esc(x)} 선호</span>`).join('')}${p.excludedMenus.map(x=>`<span class="badge amber">${esc(x)} 제외</span>`).join('')}${p.noSpicy?'<span class="badge amber">매운 메뉴 제외</span>':''}</div><p class="tiny">아래에 표시된 조건만 추천에 반영됩니다. 다르게 이해했다면 문장을 수정해 주세요.</p>${p.notes.length?`<div class="hint warn" style="margin-top:12px">${p.notes.map(n=>`<p>${esc(n)}</p>`).join('')}</div><label class="check"><input name="acknowledge" type="checkbox" required>미반영 내용을 확인했고, 표시된 조건으로 진행할게요</label>`:''}</div>`;}
function conditions(){
 const m=state.members.find(x=>x.id===state.active)||state.members[0];
 if(m.phrase===undefined)m.phrase=[m.budget!=null?`${m.budget}원 이하`:'',m.minutes!=null?`${m.minutes}분 안에 돌아와야 해요`:'',m.preference&&m.preference!=='아무거나'?m.preference+' 먹고 싶어요':'',m.noSpicy?'매운 건 못 먹어요':''].filter(Boolean).join(', ');
 return `<div class="row between"><div><p class="eyebrow">OUR LUNCH TABLE</p><h2>${esc(state.room.name)}</h2><p class="sub">각자 원하는 한 끼를, 편하게 한 문장으로.</p></div><button class="yellow" data-action="invite">카카오톡 초대 미리보기</button></div>${memberButtons()}<div class="split"><section class="panel"><div class="row between"><h3>${esc(m.name)}님의 한 끼 조건</h3><span class="badge">본인 조건</span></div><form id="condition-form"><label class="field">어떤 식사를 원하세요?<textarea name="phrase" maxlength="500" required placeholder="먹고 싶은 음식이나 피하고 싶은 것, 예산 등을 편하게 적어 주세요.">${esc(m.phrase||'')}</textarea></label><p class="tiny" style="margin-top:10px">예산·시간·메뉴를 모두 말할 필요는 없어요. 특별한 조건이 없으면 “아무거나 괜찮아”라고 적어 주세요.</p><div class="chips"><button type="button" data-action="example" data-example="normal">만원 · 짜장면 · 50분</button><button type="button" data-action="example" data-example="spicy">매운 건 못 먹어</button><button type="button" data-action="example" data-example="none">아무거나 괜찮아</button></div><div id="condition-preview" aria-live="polite">${m.parsed?conditionSummary(m.parsed):''}</div><button class="primary full" style="margin-top:22px" type="submit">${m.parsed?'이 조건으로 저장하기':'조건 반영하기'}</button><p class="notice">중간발표 데모: 일부 표현을 규칙으로 해석합니다. 실제 LLM은 연결하지 않았어요.</p><p class="tiny" id="condition-saved">${m.ready?'저장한 조건입니다. 문장을 바꾸면 다시 확인해 주세요.':''}</p></form></section><div><section class="panel"><div class="row between"><h3>모인 친구들</h3><span class="badge">${state.members.length}명</span></div>${state.members.map(x=>`<div class="member-line"><span class="avatar">${esc(x.name.slice(0,1))}</span><div><strong>${esc(x.name)}</strong><p class="tiny" data-member-status="${esc(x.id)}">${x.ready?'조건 확인 완료':'조건 확인 중'}</p></div></div>`).join('')}<div class="actions"><button class="full" data-action="sample-members" ${state.members.some(x=>x.id==='friend1')?'disabled':''}>시연 친구 2명 추가</button><button class="text tiny" data-action="show-join">다른 닉네임으로 참여</button></div></section><section class="panel" style="margin-top:17px"><h3>말씀한 조건만 반영해요</h3><p class="sub" style="font-size:13px">입력하지 않은 예산·시간은 제한하지 않아요. 메뉴 선호는 후보 순서에 반영합니다.</p><div class="hint" style="margin-top:18px">한 브라우저에서 닉네임을 바꿔 시연합니다. 미반영 조건은 결과 화면에서도 안내해요.</div><button class="orange full" style="margin-top:20px" data-action="recommend" ${state.members.every(x=>x.ready)?'':'disabled'}>식당 후보 찾기 →</button></section></div></div>`;
}
function setConditionDraft(phrase){const m=state.members.find(x=>x.id===state.active);m.phrase=phrase;m.parsed=null;m.ready=false;state.candidates=[];state.votes={};state.submitted=[];state.winner=null;save();document.getElementById('condition-preview').innerHTML='';document.getElementById('condition-saved').textContent='';document.querySelector('#condition-form button[type=submit]').textContent='조건 반영하기';document.querySelector('[data-action=recommend]').disabled=true;document.querySelector(`[data-member-status="${m.id}"]`).textContent='조건 확인 중';}
function conditionExample(which){const examples={normal:'만원 이하로 짜장면 먹고 싶고 50분 안에 돌아와야 해요.',cheap:'8천원 이하로 먹고 45분 안에 돌아와야 해요.',empty:'5천원 이하로 먹고 20분 안에 돌아와야 해요.',spicy:'돈은 상관없고 매운 건 못 먹어.',none:'아무거나 괜찮아'};const f=document.getElementById('condition-form');f.elements.phrase.value=examples[which]||examples.normal;setConditionDraft(f.elements.phrase.value);}
document.addEventListener('input',e=>{if(e.target.matches('#condition-form [name=phrase]'))setConditionDraft(e.target.value);});

function matchedPlaces(){return state.places.filter(p=>p.status!=='pending'&&state.members.every(m=>(m.budget==null||p.price<=m.budget)&&(m.minutes==null||p.minutes<=m.minutes)&&(!m.noSpicy||!p.spicy)&&!(m.excludedMenus||[]).some(x=>p.menu.includes(x)||p.category.includes(x)))).map(p=>({...p,score:state.members.filter(m=>(m.preferences||[m.preference]).some(x=>x&&x!=='아무거나'&&(p.menu.includes(x)||p.category.includes(x)))).length})).sort((a,b)=>b.score-a.score||a.minutes-b.minutes||a.id.localeCompare(b.id)).slice(0,3);}
function card(p,vote=false){const selected=(state.votes[state.active]||[]).includes(p.id);return `<article class="restaurant">${food(p)}<div class="card-body"><span class="tiny">${esc(p.category)} · 도보 편도 약 ${p.walk}분</span><h3>${esc(p.name)}</h3><div class="data-row"><span>${esc(p.menu)}</span><span class="price">${won(p.price)}</span></div><div class="data-row"><span>왕복·대기·식사 예상</span><strong>${p.minutes}분</strong></div><p class="tiny">가격 확인 ${esc(p.checked)} · 시연 자료</p><p class="card-reason">${vote?'입력한 수치·제외 조건 충족 (시연 데이터)'+(p.score?` · ${p.score}명의 메뉴 선호 충족`:''):'메뉴 정보와 확인 날짜를 함께 쌓아요.'}</p>${vote?`<button class="vote-btn ${selected?'chosen':''}" data-action="vote" data-id="${p.id}" aria-pressed="${selected}">${selected?'✓ 갈 수 있어요':'이곳도 좋아요'}</button>`:`<button class="vote-btn" data-action="edit-place" data-id="${p.id}">메뉴 정보 보태기</button>`}</div></article>`;}
function voting(){return `<div class="row between"><div><p class="eyebrow">LET'S FIND OUR FAVORITE</p><h2>${state.candidates.length?'우리 모두 갈 수 있는 '+state.candidates.length+'곳':'조건에 맞는 식당이 없어요'}</h2><p class="sub">${state.candidates.length?'가도 좋은 곳을 모두 골라 주세요. 참가자마다 선택을 저장해요.':'시연 목록의 메뉴 가격과 예상 시간이 현재 조건에 맞지 않아요.'}</p></div><button data-action="back-conditions">조건 다시 조정</button></div>${state.members.some(m=>m.notes?.length)?'<div class="hint warn" style="margin-top:18px">미반영 조건이 있습니다. 분위기·식재료 등 확인하지 못한 조건을 충족하는 추천은 아닙니다. 조건 화면에서 해석 내용을 확인해 주세요.</div>':''}${state.candidates.length?`${memberButtons()}<p class="tiny" style="margin-bottom:16px">${esc(state.members.find(m=>m.id===state.active)?.name)}님의 선택 · 여러 곳 선택 가능 · ${state.submitted.length}/${state.members.length}명 투표 완료</p><div class="cards">${state.candidates.map(p=>card(p,true)).join('')}</div><div class="actions"><button class="primary" data-action="submit-vote">내 투표 저장</button><button data-action="sample-votes">시연 친구들 투표 채우기</button><button class="orange" data-action="finish-vote" ${state.submitted.length===state.members.length?'':'disabled'}>투표 마감하고 결과 보기 →</button></div><p class="notice">동률은 예상 소요 시간이 짧은 순으로 결정해요. 조건을 다시 바꾸면 투표도 새로 시작해요.</p>`:`<div class="empty" style="margin-top:25px"><h3>조건을 조금 조정해 볼까요?</h3><p class="sub">예산이나 복귀 시간을 직접 변경할 수 있어요.<br>조건을 자동으로 완화하지 않아요.</p><button class="primary" data-action="back-conditions" style="margin-top:20px">내 조건 수정하기</button></div>`}`;}
function result(){const p=state.winner;const votes=Object.values(state.votes).filter(ids=>ids.includes(p.id)).length;return `<div class="result-hero"><div class="result-icon" aria-hidden="true">✦</div><p class="eyebrow">TODAY'S TABLE IS READY</p><h1>오늘은 ${esc(p.name)}에서!</h1><p class="sub">${state.members.length}명 중 ${votes}명이 함께 가고 싶은 곳으로 골랐어요.</p></div><div class="result-box"><article class="restaurant">${food(p)}<div class="card-body"><div class="row between"><div><h3>${esc(p.name)}</h3><p class="sub">${esc(p.menu)} · ${won(p.price)}</p></div><span class="badge">식당 결정 완료</span></div><div class="metrics"><div><p class="tiny">총 예상 시간</p><p class="metric">${p.minutes}<small>분</small></p></div><div><p class="tiny">함께 먹는 친구</p><p class="metric">${state.members.length}<small>명</small></p></div><div><p class="tiny">투표 회차</p><p class="metric">${state.round}</p></div></div><p class="notice">예상 시간은 보장되지 않아요. 가상 가게이므로 실제 길찾기는 제공하지 않아요.</p><div class="actions"><button class="yellow" data-action="share-result">결과 공유 미리보기</button><button class="primary" data-action="visit">다녀왔어요 · 정보 보태기 →</button></div></div></article><section class="panel" style="margin-top:18px"><h3>우리의 투표</h3>${state.candidates.map(c=>{const n=Object.values(state.votes).filter(ids=>ids.includes(c.id)).length;return `<div class="list-row"><div class="row between"><span>${esc(c.name)}</span><strong>${n}표</strong></div><div class="progress"><i style="width:${n/state.members.length*100}%"></i></div></div>`;}).join('')}</section></div>`;}
function contribute(){const p=state.places.find(x=>x.id===editingId)||state.places.find(x=>x.id===state.winner?.id)||state.places[0];editingId=p.id;return `<p class="eyebrow">A SMALL UPDATE, A BETTER TABLE</p><h2>다음 사람에게 정확한 한 끼를</h2><p class="sub">${esc(p.name)}의 메뉴·가격을 확인해 주세요.</p><div class="split" style="margin-top:25px"><section class="panel"><h3>메뉴판 한 장으로 시작해요</h3><p class="sub" style="font-size:13px">사진을 확인하고 메뉴와 가격을 보태 주세요.</p><label class="field">메뉴판 사진<input id="photo-input" class="file-input" type="file" accept="image/png,image/jpeg,image/webp"></label><button data-action="sample-photo">시연 메뉴판 사용하기</button><div id="photo-area">${photo?`<img class="photo-preview" src="${photo}" alt="사용자가 선택한 메뉴판 사진"><p class="tiny">${esc(photoLabel)}</p>`:photoLabel==='sample'?menuSample(p):'<div class="empty" style="margin-top:17px"><p class="tiny">사진을 올리거나 시연 메뉴판을 선택해 주세요.</p></div>'}</div><button class="full" style="margin-top:15px" data-action="ocr" ${photo||photoLabel==='sample'?'':'disabled'}>메뉴·가격 초안 보기</button><p class="notice">인식 버튼은 시연 초안을 채워요. 실제 사진 분석은 하지 않습니다.</p></section><section class="panel"><div class="row between"><h3>내용 확인 후 저장</h3><span class="badge amber">사용자 확인</span></div><form id="edit-form"><label class="field">메뉴 이름<input name="menu" value="${esc(p.menu)}" maxlength="30" required></label><label class="field">확인한 가격<input name="price" type="number" min="500" max="200000" step="100" value="${p.price}" required></label><p class="tiny" style="margin-top:8px">기존 가격 ${won(p.price)} · 확인 ${esc(p.checked)}</p><label class="check"><input name="verified" type="checkbox" required>사진 또는 실제 메뉴판과 내용을 비교했어요</label><button class="primary full" style="margin-top:24px" type="submit">확인한 정보 저장하기</button></form><div class="hint" style="margin-top:20px">저장한 가격은 다음 추천부터 반영돼요. 이미 마감한 투표 결과는 그대로 남아요.</div><button class="text" data-action="re-recommend" style="margin-top:18px" ${state.members.length?'':'disabled'}>변경된 정보로 다시 추천받기 →</button></section></div>`;}
function menuSample(p){return `<div class="menu-preview"><p class="tiny">시연용 메뉴판 · 실제 가게 정보 아님</p><h3>${esc(p.name)}</h3><div class="menu-row"><strong>${esc(p.menu)}</strong><strong>12,000원</strong></div><div class="menu-row"><span>곱빼기 추가</span><span>1,000원</span></div><p class="tiny" style="margin-top:20px">업데이트 예시: 대표 메뉴 가격 변경</p></div>`;}
function wiki(){return `<div class="row between"><div><p class="eyebrow">OUR NEIGHBORHOOD GUIDE</p><h1>우리가 채우는 동네 가게</h1><p class="sub">오래된 가격을 고치고, 골목의 작은 가게를 소개해요.</p></div><button class="primary" data-action="new-place">+ 가게 등록 제안</button></div><div class="metrics"><div><p class="tiny">함께 살펴볼 가게</p><p class="metric">${state.places.filter(p=>p.status!=='pending').length}</p></div><div><p class="tiny">내 정보 기여</p><p class="metric">${state.contributions}</p></div><div><p class="tiny">새 가게 확인 대기</p><p class="metric">${state.places.filter(p=>p.status==='pending').length}</p></div></div><div class="section-head"><h3>메뉴와 가격을 확인해 주세요</h3><p class="tiny">전체 목록은 시연용 가상 가게입니다.</p></div><div class="cards">${state.places.filter(p=>p.status!=='pending').map(p=>card(p)).join('')}</div>${state.places.some(p=>p.status==='pending')?`<section class="panel" style="margin-top:22px"><h3>등록 확인 중</h3>${state.places.filter(p=>p.status==='pending').map(p=>`<div class="list-row"><strong>${esc(p.name)}</strong><p class="tiny">${esc(p.address)} · ${esc(p.evidence)} · 중복·위치 확인 후 추천에 포함될 예정</p></div>`).join('')}</section>`:''}`;}
function profile(){return `<p class="eyebrow">MY CONTRIBUTION</p><div class="profile-hero"><span class="avatar">나</span><div><h1>나의 동네 식탁</h1><p class="sub">내가 보탠 정보가 다음 한 끼를 바꿔요.</p></div></div><div class="metrics"><div><p class="tiny">정보 기여</p><p class="metric">${state.contributions}</p></div><div><p class="tiny">기여 포인트 · 시연</p><p class="metric">${state.contributions*10}</p></div><div><p class="tiny">우리 모임 추천 회차</p><p class="metric">${state.round}</p></div></div><div class="grid2" style="margin-top:22px"><section class="panel"><h3>내가 모은 배지</h3><div class="badge-collection"><div class="achievement ${state.contributions?'':'locked'}"><span>✦</span><strong>첫 정보 기여</strong></div><div class="achievement ${state.contributions>=3?'':'locked'}"><span>♧</span><strong>골목 기록가</strong></div></div><p class="notice">실서비스에서는 다른 사용자가 확인한 기여를 기준으로 보상을 설계할 예정이에요.</p></section><section class="panel"><h3>최근 기여 기록</h3><div class="feed">${state.history.length?state.history.slice().reverse().map(h=>`<article><strong>${esc(h.name)}</strong><p>${esc(h.description)}</p><p class="tiny">${esc(h.date)} · 이 기기의 시연 기록</p></article>`).join(''):'<p class="sub">아직 기여한 정보가 없어요.</p><button data-action="nav" data-view="wiki" style="margin-top:18px">동네 가게 둘러보기</button>'}</div></section></div>`;}
function modal(html){lastFocus=document.activeElement;document.getElementById('modal-content').innerHTML=html;document.getElementById('modal').hidden=false;document.querySelector('#modal button, #modal input')?.focus();}
function closeModal(){document.getElementById('modal').hidden=true;lastFocus?.focus();}
function invite(resultMode=false){const url=location.href.split('#')[0]+'#room='+state.room.code;modal(`<h2 id="modal-title">${resultMode?'식당 결정 공유':'카카오톡 초대'} 미리보기</h2><p class="sub">실제 카카오 전송 없이 공유할 내용을 확인해요.</p><div class="invite-card"><p class="tiny">월계밥상 · ${esc(state.room.name)}</p><h3 style="margin:10px 0">${resultMode?'오늘은 '+esc(state.winner.name)+'에서 먹어요!':'우리 점심, 같이 정하자!'}</h3><p>${resultMode?esc(state.winner.menu)+' · '+won(state.winner.price):'각자 먹고 싶은 메뉴와 예산을 알려 주세요.'}</p><p class="code" style="margin-top:18px">${state.room.code}</p></div><label class="tiny" for="share-link">시연 링크</label><input id="share-link" class="copy-field" readonly value="${esc(url)}"><button class="yellow full" data-action="copy-invite">초대 문구 복사</button><p class="notice">같은 기기의 데모 모임만 이어집니다. 다른 기기와의 공동 접속은 본선 구현 예정입니다.</p>`);}
function beginRecommendation(){if(!state.members.length||!state.members.every(m=>m.ready))return notify('모든 참가자의 조건을 먼저 확인하고 저장해 주세요.');state.candidates=matchedPlaces();state.votes={};state.submitted=[];state.winner=null;state.round++;state.stage=2;state.view='meal';render();window.scrollTo(0,0);}
document.addEventListener('submit',e=>{
 e.preventDefault();const form=e.target;if(!form.reportValidity())return;const d=new FormData(form);
 if(form.id==='create-form'){const name=String(d.get('roomName')).trim(),nickname=String(d.get('nickname')).trim();if(!name||!nickname)return notify('모임 이름과 닉네임을 입력해 주세요.');state.room={name,code:'WG'+Math.floor(1000+Math.random()*9000)};state.members=[{id:'me',name:nickname,budget:null,minutes:null,preference:'아무거나',phrase:'',noSpicy:false,ready:false}];state.active='me';state.stage=1;state.round=0;state.votes={};state.submitted=[];render();}
 if(form.id==='join-form'){const code=String(d.get('code')).trim().toUpperCase(),name=String(d.get('nickname')).trim();if(!state.room||code!==state.room.code)return notify('이 브라우저에서 만든 모임 코드를 확인해 주세요.');if(!name)return notify('닉네임을 입력해 주세요.');if(state.members.length>=5)return notify('이 데모는 최대 5명까지 참여할 수 있어요.');if(state.members.some(m=>m.name===name))return notify('다른 닉네임을 입력해 주세요.');const id='m'+Date.now();state.members.push({id,name,budget:null,minutes:null,preference:'아무거나',phrase:'',noSpicy:false,ready:false});state.active=id;state.stage=1;state.votes={};state.submitted=[];state.candidates=[];state.winner=null;closeModal();render();}
 if(form.id==='condition-form'){const m=state.members.find(m=>m.id===state.active),phrase=String(d.get('phrase')).trim();if(!phrase)return notify('원하는 식사를 한 문장으로 적어 주세요.');if(!m.parsed||m.parsed.phrase!==phrase){m.phrase=phrase;m.parsed=naturalConditions(phrase);m.ready=false;render();return;}Object.assign(m,m.parsed,{ready:true});state.candidates=[];state.votes={};state.submitted=[];state.winner=null;render();notify('확인한 조건을 저장했어요.');}
 if(form.id==='edit-form'){const p=state.places.find(p=>p.id===editingId);const menu=String(d.get('menu')).trim(),price=Number(d.get('price'));if(!menu)return notify('메뉴 이름을 입력해 주세요.');if(menu===p.menu&&price===p.price)return notify('변경된 메뉴 이름이나 가격을 입력해 주세요.');const prev=p.price,prevMenu=p.menu;p.menu=menu;p.price=price;p.checked=new Date().toLocaleDateString('sv-SE').replaceAll('-','.');state.contributions++;state.history.push({name:p.name,description:`${prevMenu} ${won(prev)} → ${menu} ${won(price)} · 정보 수정`,date:p.checked});photo=null;photoLabel='';state.view='profile';render();notify('정보를 저장했어요. 다음 추천에 반영됩니다.');}
 if(form.id==='new-place-form'){const name=String(d.get('name')).trim(),address=String(d.get('address')).trim(),file=form.elements.evidence.files[0];if(!name||!address)return notify('가게 이름과 위치를 입력해 주세요.');if(state.places.some(p=>p.name===name))return notify('같은 이름의 가게가 있어요. 기존 가게를 먼저 확인해 주세요.');if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024)return notify('4MB 이하 JPG·PNG·WebP 사진을 선택해 주세요.');state.places.push({id:'new'+Date.now(),name,address,evidence:file.name,status:'pending'});state.history.push({name,description:'간판 사진과 위치로 새 가게 등록 제안 · 확인 대기',date:new Date().toLocaleDateString('sv-SE')});closeModal();state.view='wiki';render();notify('등록 제안을 저장했어요. 확인 후 추천에 포함할 예정이에요.');}
});
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='nav'){state.view=b.dataset.view;render();window.scrollTo(0,0);}
 if(a==='member'){state.active=b.dataset.id;render();}
 if(a==='reset'){modal('<h2 id="modal-title">데모를 처음부터 시작할까요?</h2><p class="sub">이 기기에 저장된 시연 모임·투표·수정 기록을 초기화합니다.</p><button class="orange full" style="margin-top:20px" data-action="confirm-reset">초기화하고 시작</button>');}
 if(a==='confirm-reset'){state=fresh();photo=null;photoLabel='';editingId=null;closeModal();render();}
 if(a==='invite')invite();if(a==='share-result')invite(true);if(a==='close-modal')closeModal();
 if(a==='copy-invite'){const input=document.getElementById('share-link');const msg=`${state.room.name} · 월계밥상\n팀 코드 ${state.room.code}\n${input.value}\n중간발표 시연용 링크입니다.`;try{await navigator.clipboard.writeText(msg);notify('초대 문구를 복사했어요.');}catch{input.focus();input.select();notify('링크를 선택했어요. Ctrl+C로 복사해 주세요.');}}
 if(a==='show-join'){modal(`<h2 id="modal-title">새 참가자로 들어가기</h2><form id="join-form"><label class="field">팀 코드<input name="code" value="${state.room.code}" required maxlength="6"></label><label class="field">닉네임<input name="nickname" maxlength="12" required></label><button type="submit" class="primary full" style="margin-top:20px">참여하기</button></form>`);}
 if(a==='sample-members'){if(state.members.length>3)return notify('시연 친구 2명을 추가할 자리가 없어요.');if(state.members.some(x=>x.id==='friend1'))return;state.members.push({id:'friend1',name:'친구 A',budget:10000,minutes:50,preference:'아무거나',noSpicy:false,ready:true},{id:'friend2',name:'친구 B',budget:10000,minutes:50,preference:'짜장면',noSpicy:false,ready:true});render();notify('조건을 입력한 시연 친구 2명이 참여했어요.');}
 if(a==='example')conditionExample(b.dataset.example);
 if(a==='recommend'){if(!state.members.length||!state.members.every(m=>m.ready))return notify('모든 참가자의 조건 입력을 기다려 주세요.');beginRecommendation();}
 if(a==='back-conditions'){state.stage=1;state.votes={};state.submitted=[];state.candidates=[];render();}
 if(a==='vote'){const votes=state.votes[state.active]||[];state.votes[state.active]=votes.includes(b.dataset.id)?votes.filter(id=>id!==b.dataset.id):[...votes,b.dataset.id];state.submitted=state.submitted.filter(id=>id!==state.active);render();}
 if(a==='submit-vote'){if(!(state.votes[state.active]||[]).length)return notify('갈 수 있는 식당을 하나 이상 선택해 주세요.');if(!state.submitted.includes(state.active))state.submitted.push(state.active);render();notify('투표를 저장했어요.');}
 if(a==='sample-votes'){let n=0;for(const m of state.members.filter(m=>m.id==='friend1'||m.id==='friend2')){state.votes[m.id]=state.candidates.slice(0,m.id==='friend1'?2:1).map(p=>p.id);if(!state.submitted.includes(m.id))state.submitted.push(m.id);n++;}render();notify(n?'시연 친구들의 투표를 저장했어요.':'시연 친구가 없어요. 참가자를 전환해 직접 투표해 주세요.');}
 if(a==='finish-vote'){if(state.submitted.length!==state.members.length)return;const count=id=>Object.values(state.votes).filter(v=>v.includes(id)).length;state.winner=structuredClone([...state.candidates].sort((a,b)=>count(b.id)-count(a.id)||a.minutes-b.minutes||a.id.localeCompare(b.id))[0]);state.stage=3;render();window.scrollTo(0,0);}
 if(a==='visit'){editingId=state.winner.id;state.stage=4;photo=null;photoLabel='';render();window.scrollTo(0,0);}
 if(a==='edit-place'){editingId=b.dataset.id;state.stage=4;state.view='meal';photo=null;photoLabel='';render();window.scrollTo(0,0);}
 if(a==='sample-photo'){photo=null;photoLabel='sample';render();}
 if(a==='ocr'){const f=document.getElementById('edit-form');f.elements.price.value=12000;f.elements.verified.checked=false;notify('시연 초안: 12,000원. 메뉴판과 비교 후 저장해 주세요.');}
 if(a==='re-recommend'){if(state.members.length)beginRecommendation();}
 if(a==='new-place'){modal('<h2 id="modal-title">작은 가게를 소개해 주세요</h2><p class="sub">간판과 위치를 확인한 뒤 추천에 포함할 예정이에요.</p><form id="new-place-form"><label class="field">가게 이름<input name="name" maxlength="30" required></label><label class="field">위치 또는 주소<input name="address" placeholder="예: 광운로 ○번길, 정문 맞은편" maxlength="100" required></label><label class="field">간판 사진<input class="file-input" name="evidence" type="file" accept="image/png,image/jpeg,image/webp" required></label><p class="tiny">사진은 전송되지 않으며 파일명만 시연 기록에 남아요.</p><button type="submit" class="primary full" style="margin-top:20px">등록 제안하기</button></form>');}
});
document.addEventListener('change',e=>{if(e.target.id!=='photo-input')return;const file=e.target.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>4*1024*1024){e.target.value='';return notify('4MB 이하 JPG·PNG·WebP 사진을 선택해 주세요.');}const reader=new FileReader();reader.onload=()=>{photo=reader.result;photoLabel=file.name;render();};reader.onerror=()=>notify('사진을 읽지 못했어요. 다른 사진을 선택해 주세요.');reader.readAsDataURL(file);});
document.addEventListener('keydown',e=>{const modalEl=document.getElementById('modal');if(modalEl.hidden)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=modalEl.querySelectorAll('button,input,select,textarea,a[href]');const first=focusables[0],last=focusables[focusables.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
const hashCode=new URLSearchParams(location.hash.slice(1)).get('room');if(hashCode&&state.room?.code===hashCode){state.view='meal';state.stage=1;}
render();
</script></body></html>
